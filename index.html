<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanah Lux Developments</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #6f7751;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      text-align: center;
    }

.logo {
  max-width: 140px;
  height: auto;
  margin: 0 auto 24px;
  display: block;
}
    }

    h1 {
      color: white;
      margin-bottom: 24px;
    }

    a.button {
      display: block;
      width: 100%;
      padding: 16px;
      margin-bottom: 14px;
      background: white;
      color: #6f7751;
      text-decoration: none;
      font-weight: 600;
      border-radius: 10px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    a.button:hover {
      transform: scale(1.02);
      opacity: 0.9;
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }
  </style>
</head>

<body>
  <div class="container">
<img src="logo.png" alt="Tanah Lux Logo" class="logo" />

    <h1>Tanah Lux Developments</h1>

    <a class="button" href="https://wa.me/XXXXXXXXXX" target="_blank">
      Speak with the Tanah Lux Team
    </a>

    <a class="button" href="#">
      Book an Appointment
    </a>

    <a class="button" href="#">
      View Our Developments
    </a>

    <div class="footer">
      © Tanah Lux Developments
    </div>
  </div>
</body>
</html>
